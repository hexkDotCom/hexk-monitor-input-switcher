[project]
name = "monitor-switcher"
version = "0.1.0"
description = "Switch a monitor input (DDC/CI) and Logitech keyboard/mouse host (HID++) with a hotkey on Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["hidapi>=0.14"]

[project.scripts]
monitor-switcher = "monitor_switcher.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
